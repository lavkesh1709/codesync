services:
  # Main FastAPI application
  - type: web
    name: codesync-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE_MB
        value: "1"
      - key: CHUNK_SIZE_LINES
        value: "40"
      - key: CHUNK_OVERLAP_LINES
        value: "5"
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false

  # Celery worker — same Docker image, different start command
  - type: worker
    name: codesync-worker
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: uv run celery -A app.core.ingestion.tasks.celery_app worker --loglevel=info --pool=solo
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.1-8b-instant
      - key: EMBEDDING_MODEL
        value: all-MiniLM-L6-v2
      - key: APP_ENV
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MAX_FILE_SIZE_MB
        value: "1"
      - key: CHUNK_SIZE_LINES
        value: "40"
      - key: CHUNK_OVERLAP_LINES
        value: "5"
      - key: CELERY_BROKER_URL
        sync: false
      - key: CELERY_RESULT_BACKEND
        sync: false